name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare app
        run: |
          mkdir www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable.png www/
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Calculator com.mycalc.app --web-dir www
          npx cap add android
      - name: Set icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          src = Image.open("icon-512.png").convert("RGBA")
          res = "android/app/src/main/res"
          for d, s in {"mdpi":108,"hdpi":162,"xhdpi":216,"xxhdpi":324,"xxxhdpi":432}.items():
              c = Image.new("RGBA", (s, s), (0, 0, 0, 0))
              k = int(s * 0.62)
              ic = src.resize((k, k), Image.LANCZOS)
              c.paste(ic, ((s - k) // 2, (s - k) // 2), ic)
              c.save(f"{res}/mipmap-{d}/ic_launcher_foreground.png")
          for d, s in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              ic = src.resize((s, s), Image.LANCZOS)
              ic.save(f"{res}/mipmap-{d}/ic_launcher.png")
              ic.save(f"{res}/mipmap-{d}/ic_launcher_round.png")
          open(f"{res}/values/ic_launcher_background.xml", "w").write('<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#DEE1E8</color></resources>')
          PY
      - name: Build
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
